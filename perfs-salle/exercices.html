<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#03050A">
<title>Exercices · Mes perfs salle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<a class="skip" href="#main">Aller aux exercices</a>
<header class="hero mini" id="top">
  <div class="hero-top">
    <div>
      <h1>Exercices</h1>
      <p class="sub" id="sub">Force par groupe musculaire.</p>
    </div>
  </div>
</header>
<main class="wrap" id="main">
  <nav aria-label="Groupes musculaires">
    <div class="chips" id="chips"></div>
    <div class="search"><input id="q" type="search" placeholder="Chercher un exercice" aria-label="Chercher un exercice" autocomplete="off"></div>
  </nav>

  <div id="list" aria-live="polite"></div>

  <h2>Ajouter une série</h2>
  <div class="card">
    <form id="f">
      <label for="ex">Exercice
        <input id="ex" list="ex-list" placeholder="Développé incliné barre" required autocomplete="off">
      </label>
      <datalist id="ex-list"></datalist>
      <label for="g">Groupe (pour un nouvel exercice)
        <select id="g"></select>
      </label>
      <div class="grid3">
        <label for="d">Date <input id="d" type="date" required></label>
        <label for="kg">Charge (kg) <input id="kg" type="number" step="0.5" min="0" inputmode="decimal" required></label>
        <label for="r">Reps <input id="r" type="number" min="0" step="1" inputmode="numeric" required></label>
      </div>
      <label for="ok">Résultat
        <select id="ok"><option value="1">Réussie</option><option value="0">Échec (rep ratée)</option></select>
      </label>
      <button class="primary" type="submit">Ajouter</button>
    </form>
    <p class="note">Les ajouts restent dans ce navigateur, sur cet appareil. Les données de départ viennent de ton export d’application.</p>
    <div class="mine" id="mine"></div>
  </div>
</main>
<div class="tabbar" role="navigation" aria-label="Pages"><a href="./">Records</a><a href="exercices.html" aria-current="page">Exercices</a></div>
<script src="data.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
