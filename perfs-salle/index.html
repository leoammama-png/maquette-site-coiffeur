<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Mes perfs salle</title>
<style>
:root{
  --bg:#F2F5F7;--surface:#FFFFFF;--surface2:#EAF0F3;--fg:#15202B;--muted:#5A6874;--line:#D9E1E7;
  --accent:#0E6B73;--accent-soft:#D5ECEE;--accent-fg:#FFFFFF;--bad:#C93A25;--good:#1B7F4B;--warm:#8A98A4;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E151B;--surface:#16202A;--surface2:#1D2A35;--fg:#EAF0F4;--muted:#9BA9B5;--line:#263441;
    --accent:#4FC3CB;--accent-soft:#17383C;--accent-fg:#06262A;--bad:#FF7F68;--good:#5ED69B;--warm:#6F7F8C}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:48px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:28px 0 8px}
h1{font-size:30px;line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 10px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}

.prs{display:grid;gap:8px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px}
.pr .n{font-weight:650}
.pr .d{font-size:13px;color:var(--muted)}
.pr .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.pr .v small{display:block;font-weight:500;color:var(--good);font-size:12px}

nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin-top:14px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;margin:0 -16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:14px;font-weight:650;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.search{margin-top:8px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.ex-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ex-name{font-weight:700;font-size:17px;line-height:1.2}
.ex-meta{font-size:13px;color:var(--muted);margin-top:2px}
.rec{text-align:right;white-space:nowrap}
.rec b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.rec b small{font-size:13px;font-weight:600;color:var(--muted)}
.rec span{display:block;font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.spark{margin:10px 0 6px}
.spark svg{display:block;width:100%;height:44px}
.last{font-size:14px;font-variant-numeric:tabular-nums}
.last .dt{color:var(--muted);margin-right:6px}
.w{color:var(--warm)}
.f{color:var(--bad);font-weight:700}
details.hist{margin-top:8px}
details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:650;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ "}
details[open]>summary::before{content:"▾ "}
.sess{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.sess .dt{color:var(--muted)}
.sess .sets{display:flex;flex-wrap:wrap;gap:4px 10px}
.empty{color:var(--muted);text-align:center;padding:28px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
form{display:grid;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{display:grid;gap:4px;font-size:13px;font-weight:700}
button.primary{font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);padding:12px 20px;cursor:pointer}
button.ghost{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.mine{margin-top:12px}
.mine .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mes perfs salle</h1>
    <p class="sub" id="sub">Force par groupe musculaire.</p>
    <div class="tiles" id="tiles"></div>
  </header>

  <h2>Records récents</h2>
  <div class="prs" id="prs"></div>

  <nav aria-label="Groupes musculaires">
    <div class="chips" id="chips"></div>
    <div class="search"><input id="q" type="search" placeholder="Chercher un exercice" aria-label="Chercher un exercice" autocomplete="off"></div>
  </nav>

  <div id="list" aria-live="polite"></div>

  <h2>Ajouter une série</h2>
  <div class="card">
    <form id="f">
      <label for="ex">Exercice
        <input id="ex" list="ex-list" placeholder="Développé incliné barre" required autocomplete="off">
      </label>
      <datalist id="ex-list"></datalist>
      <label for="g">Groupe (pour un nouvel exercice)
        <select id="g"></select>
      </label>
      <div class="grid3">
        <label for="d">Date <input id="d" type="date" required></label>
        <label for="kg">Charge (kg) <input id="kg" type="number" step="0.5" min="0" inputmode="decimal" required></label>
        <label for="r">Reps <input id="r" type="number" min="0" step="1" inputmode="numeric" required></label>
      </div>
      <label for="ok">Résultat
        <select id="ok"><option value="1">Réussie</option><option value="0">Échec (rep ratée)</option></select>
      </label>
      <button class="primary" type="submit">Ajouter</button>
    </form>
    <p class="note">Les ajouts restent dans ce navigateur, sur cet appareil. Les données de départ viennent de ton export d’application.</p>
    <div class="mine" id="mine"></div>
  </div>
</div>

<script>
(function(){
  var BASE=JSON.parse(document.getElementById('data').textContent);
  var KEY='perfs-salle-v2';
  var extras=[];
  try{extras=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){extras=[]}
  if(!Array.isArray(extras))extras=[];
  function saveExtras(){try{localStorage.setItem(KEY,JSON.stringify(extras))}catch(e){}}

  var state={group:'Pectoraux',q:''};
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmtD(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?m[3]+'/'+m[2]:d}
  function fmtDY(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?m[3]+'/'+m[2]+'/'+m[1]:d}
  function num(n){return String(Math.round(n*100)/100).replace('.',',')}

  /* --- modèle --- */
  function build(){
    var gs=JSON.parse(JSON.stringify(BASE.groups));
    function findEx(name){
      for(var i=0;i<gs.length;i++)for(var j=0;j<gs[i].ex.length;j++)if(gs[i].ex[j].n.toLowerCase()===name.toLowerCase())return gs[i].ex[j];
      return null;
    }
    extras.forEach(function(x){
      var e=findEx(x.n);
      if(!e){
        var g=null;gs.forEach(function(k){if(k.g===x.g)g=k});
        if(!g){g={g:x.g,ex:[]};gs.push(g)}
        e={n:x.n,ss:[]};g.ex.push(e);
      }
      var ses=null;e.ss.forEach(function(s){if(s.d===x.d)ses=s});
      if(!ses){ses={d:x.d,s:[]};e.ss.push(ses);e.ss.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0})}
      ses.s.push([x.kg,x.r,x.ok?'n':'f']);
    });
    return gs;
  }
  function topOf(ses){
    var best=null;
    ses.s.forEach(function(a){
      if(a[2]==='w'||a[2]==='f'||a[1]<1)return;
      if(!best||a[0]>best[0]||(a[0]===best[0]&&a[1]>best[1]))best=a;
    });
    return best;
  }
  function analyse(e){
    var tops=[];
    e.ss.forEach(function(s){var t=topOf(s);if(t)tops.push({d:s.d,kg:t[0],r:t[1]})});
    var rec=null;
    tops.forEach(function(t){if(!rec||t.kg>rec.kg||(t.kg===rec.kg&&t.r>rec.r))rec=t});
    var isPR=false,prevBest=null;
    if(tops.length>=3){
      var last=tops[tops.length-1];
      var prior=tops.slice(0,-1);
      prevBest=Math.max.apply(null,prior.map(function(t){return t.kg}));
      isPR=last.kg>prevBest;
    }
    return {tops:tops,rec:rec,isPR:isPR,prevBest:prevBest};
  }

  /* --- rendu --- */
  function setHtml(a){
    var t=a[2],txt=num(a[0])+'×'+a[1];
    if(t==='w')return '<span class="w" title="Échauffement">('+txt+')</span>';
    if(t==='f')return '<span class="f">'+txt+' échec</span>';
    if(a[1]===0)return '<span class="f">'+num(a[0])+'×0</span>';
    if(t==='d')return '<span>'+txt+' <small class="w">drop</small></span>';
    return '<span>'+txt+'</span>';
  }
  function spark(tops,name){
    var pts=tops.slice(-24);
    if(pts.length<2)return '';
    var W=300,H=44,P=5,ks=pts.map(function(t){return t.kg});
    var lo=Math.min.apply(null,ks),hi=Math.max.apply(null,ks);
    if(hi===lo){hi+=1;lo-=1}
    function X(i){return P+i*(W-2*P)/(pts.length-1)}
    function Y(k){return H-P-(k-lo)*(H-2*P)/(hi-lo)}
    var line=pts.map(function(t,i){return X(i).toFixed(1)+','+Y(t.kg).toFixed(1)}).join(' ');
    var li=pts.length-1;
    return '<div class="spark"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Évolution de la charge max, '+esc(name)+' : de '+num(ks[0])+' à '+num(ks[li])+' kg">'+
      '<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>'+
      '</svg></div>';
  }
  function exHtml(e){
    var an=analyse(e);
    var sessions=e.ss.slice();
    var last=sessions[sessions.length-1];
    var recTxt=an.rec?'<div class="rec"><b>'+num(an.rec.kg)+' <small>kg × '+an.rec.r+'</small></b><span>record · '+fmtD(an.rec.d)+'</span></div>':'<div class="rec"><span>pas de série valide</span></div>';
    var h='<article class="ex"><div class="ex-top"><div><div class="ex-name">'+esc(e.n)+(an.isPR?'<span class="badge">RECORD</span>':'')+'</div>'+
      '<div class="ex-meta">'+sessions.length+' séance'+(sessions.length>1?'s':'')+'</div></div>'+recTxt+'</div>';
    h+=spark(an.tops,e.n);
    if(last)h+='<div class="last"><span class="dt">'+fmtD(last.d)+'</span>'+last.s.map(setHtml).join(' · ')+'</div>';
    if(sessions.length>1){
      h+='<details class="hist"><summary>Historique ('+Math.min(sessions.length,10)+' dernières)</summary>';
      sessions.slice(-10).reverse().forEach(function(s){
        h+='<div class="sess"><span class="dt">'+fmtD(s.d)+'</span><span class="sets">'+s.s.map(setHtml).join('')+'</span></div>';
      });
      h+='</details>';
    }
    return h+'</article>';
  }

  function render(){
    var gs=build();
    var days={},nsets=0,first=null,lastD=null;
    gs.forEach(function(g){g.ex.forEach(function(e){e.ss.forEach(function(s){
      var w=s.s.filter(function(a){return a[2]!=='w'});
      if(w.length){days[s.d]=1;nsets+=w.length}
      if(!first||s.d<first)first=s.d;if(!lastD||s.d>lastD)lastD=s.d;
    })})});
    $('tiles').innerHTML=
      '<div class="tile"><b>'+Object.keys(days).length+'</b><span>jours d’entraînement</span></div>'+
      '<div class="tile"><b>'+nsets+'</b><span>séries de travail</span></div>'+
      '<div class="tile"><b>'+fmtD(lastD)+'</b><span>dernière séance</span></div>';
    $('sub').textContent='Force par groupe musculaire, depuis le '+fmtDY(first)+'.';

    /* records récents : 21 jours avant la dernière séance */
    var ref=new Date(lastD+'T12:00:00');ref.setDate(ref.getDate()-21);
    var cut=ref.toISOString().slice(0,10),prs=[];
    gs.forEach(function(g){g.ex.forEach(function(e){
      var an=analyse(e);
      if(an.tops.length<3)return;
      var run=an.tops[0].kg;
      for(var i=1;i<an.tops.length;i++){
        var t=an.tops[i];
        if(t.kg>run&&t.d>=cut)prs.push({n:e.n,d:t.d,kg:t.kg,r:t.r,from:run});
        if(t.kg>run)run=t.kg;
      }
    })});
    /* un seul record par exercice : le plus récent */
    var seen={};prs=prs.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.kg-a.kg}).filter(function(p){if(seen[p.n])return false;seen[p.n]=1;return true}).slice(0,5);
    $('prs').innerHTML=prs.length?prs.map(function(p){
      return '<div class="pr"><div><div class="n">'+esc(p.n)+'</div><div class="d">'+fmtD(p.d)+'</div></div>'+
        '<div class="v">'+num(p.kg)+' kg × '+p.r+'<small>+'+num(p.kg-p.from)+' kg</small></div></div>';
    }).join(''):'<p class="note">Aucun record dans les 3 dernières semaines.</p>';

    /* chips */
    var names=['Tous'].concat(gs.map(function(g){return g.g}));
    if(names.indexOf(state.group)<0)state.group='Tous';
    $('chips').innerHTML=names.map(function(n){
      return '<button type="button" class="chip" data-g="'+esc(n)+'" aria-pressed="'+(n===state.group)+'">'+esc(n)+'</button>';
    }).join('');

    /* liste */
    var q=state.q.trim().toLowerCase(),out='',count=0;
    gs.forEach(function(g){
      if(state.group!=='Tous'&&g.g!==state.group)return;
      var list=g.ex.filter(function(e){return !q||e.n.toLowerCase().indexOf(q)>-1});
      if(!list.length)return;
      if(state.group==='Tous')out+='<h2>'+esc(g.g)+'</h2>';
      list.forEach(function(e){out+=exHtml(e);count++});
    });
    $('list').innerHTML=count?out:'<p class="empty">Aucun exercice trouvé.</p>';

    /* formulaire */
    var all=[];gs.forEach(function(g){g.ex.forEach(function(e){all.push(e.n)})});
    $('ex-list').innerHTML=all.sort().map(function(n){return '<option value="'+esc(n)+'">'}).join('');
    var cur=$('g').value;
    $('g').innerHTML=gs.map(function(g){return '<option>'+esc(g.g)+'</option>'}).join('');
    if(cur)$('g').value=cur;

    /* mes ajouts */
    $('mine').innerHTML=extras.length?'<h2 style="margin-top:0">Mes ajouts</h2>'+extras.map(function(x,i){
      return '<div class="r"><span>'+fmtD(x.d)+' · '+esc(x.n)+' · '+num(x.kg)+'×'+x.r+(x.ok?'':' (échec)')+'</span><button class="ghost" data-del="'+i+'" aria-label="Supprimer cet ajout">Suppr.</button></div>';
    }).join(''):'';
  }

  /* --- événements --- */
  $('chips').addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-g]');if(!b)return;
    state.group=b.getAttribute('data-g');render();
  });
  $('q').addEventListener('input',function(){state.q=this.value;render();var q=$('q');q.focus()});
  $('mine').addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-del]');if(!b)return;
    extras.splice(parseInt(b.getAttribute('data-del'),10),1);saveExtras();render();
  });
  $('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var kg=parseFloat($('kg').value),r=parseInt($('r').value,10),n=$('ex').value.trim();
    if(isNaN(kg)||isNaN(r)||!n)return;
    extras.push({n:n,g:$('g').value,d:$('d').value||new Date().toISOString().slice(0,10),kg:kg,r:r,ok:$('ok').value==='1'});
    saveExtras();
    $('kg').value='';$('r').value='';
    render();
  });
  $('d').value=new Date().toISOString().slice(0,10);
  render();
})();
</script>
</body>
</html>
