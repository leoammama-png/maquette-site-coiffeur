<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mes perfs salle</title>
<style>
:root{--bg:#F4F6F8;--surface:#fff;--fg:#17202A;--muted:#566370;--accent:#0E6B73;--accent-fg:#fff;--bad:#D9442E;--line:#DCE2E8}
@media (prefers-color-scheme:dark){:root{--bg:#0F161C;--surface:#17212A;--fg:#EAF0F4;--muted:#9AA8B4;--accent:#4FC3CB;--accent-fg:#06262A;--bad:#FF7A63;--line:#26323C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px 40px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:30px;margin:28px 0 4px;line-height:1.1}
h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:13px;color:var(--muted)}
form{display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:13px;font-weight:700;display:grid;gap:4px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
button{font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);padding:12px 20px;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 12px;font-weight:500;font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fail{color:var(--bad);font-weight:700}
.table-wrap{overflow-x:auto}
svg{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--muted);margin-top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<h1>Mes perfs salle</h1>
<p class="sub">Suivi de la force, exercice par exercice.</p>

<div class="card">
  <div class="stats">
    <div class="stat"><b id="s-max">–</b><span>Record (kg)</span></div>
    <div class="stat"><b id="s-n">–</b><span>Séries notées</span></div>
    <div class="stat"><b id="s-last">–</b><span>Dernière charge</span></div>
  </div>
</div>

<div class="card">
  <h2>Progression</h2>
  <label for="ex-filter">Exercice
    <select id="ex-filter"></select>
  </label>
  <div id="chart" role="img" aria-label="Courbe de la charge par série"></div>
  <p class="note">Une série échouée apparaît en rouge dans le tableau.</p>
</div>

<div class="card">
  <h2>Ajouter une série</h2>
  <form id="f">
    <label for="ex">Exercice <input id="ex" value="Développé incliné barre" required></label>
    <div class="grid">
      <label for="d">Date <input id="d" type="date"></label>
      <label for="kg">Charge (kg) <input id="kg" type="number" step="0.5" min="0" inputmode="decimal" required></label>
      <label for="r">Reps <input id="r" type="number" min="0" step="1" inputmode="numeric" required></label>
    </div>
    <label for="ok">Résultat
      <select id="ok"><option value="1">Réussie</option><option value="0">Échec (rep ratée)</option></select>
    </label>
    <button type="submit">Ajouter</button>
  </form>
  <p class="note">Les données sont gardées dans ce navigateur, sur cet appareil.</p>
</div>

<div class="card">
  <h2>Historique</h2>
  <div class="table-wrap">
    <table><thead><tr><th>Date</th><th>Exercice</th><th>Charge</th><th>Reps</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table>
  </div>
</div>
</div>

<script>
(function(){
  var KEY='perfs-salle-v1';
  var SEED=[
    {date:'Avant le 5 nov',ex:'Développé incliné barre',kg:80,reps:4,ok:true},
    {date:'2026-11-05',ex:'Développé incliné barre',kg:80,reps:3,ok:false},
    {date:'2026-11-05',ex:'Développé incliné barre',kg:82.5,reps:2,ok:false}
  ];
  var data;
  try{var raw=localStorage.getItem(KEY);data=raw?JSON.parse(raw):null}catch(e){data=null}
  if(!Array.isArray(data))data=SEED.slice();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmtDate(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?m[3]+'/'+m[2]:d}

  function exercises(){var o={};data.forEach(function(x){o[x.ex]=1});return Object.keys(o)}
  function current(){return $('ex-filter').value}

  function fillFilter(){
    var sel=$('ex-filter'),prev=sel.value,list=exercises();
    sel.innerHTML=list.map(function(e){return '<option>'+esc(e)+'</option>'}).join('');
    if(list.indexOf(prev)>-1)sel.value=prev;
  }

  function stats(){
    var e=current(),l=data.filter(function(x){return x.ex===e});
    var okl=l.filter(function(x){return x.ok});
    $('s-max').textContent=okl.length?Math.max.apply(null,okl.map(function(x){return x.kg})):'–';
    $('s-n').textContent=l.length||'–';
    $('s-last').textContent=l.length?l[l.length-1].kg:'–';
  }

  function chart(){
    var e=current(),l=data.filter(function(x){return x.ex===e});
    var box=$('chart');
    if(l.length<2){box.innerHTML='<p class="note">Ajoutez au moins 2 séries pour voir la courbe.</p>';return}
    var W=600,H=220,P=34,ks=l.map(function(x){return x.kg});
    var lo=Math.min.apply(null,ks)-2.5,hi=Math.max.apply(null,ks)+2.5;
    function X(i){return P+i*(W-2*P)/(l.length-1)}
    function Y(k){return H-P-(k-lo)*(H-2*P)/(hi-lo)}
    var pts=l.map(function(x,i){return X(i)+','+Y(x.kg)}).join(' ');
    var dots=l.map(function(x,i){
      return '<circle cx="'+X(i)+'" cy="'+Y(x.kg)+'" r="5" fill="'+(x.ok?'var(--accent)':'var(--bad)')+'"/>'+
        '<text x="'+X(i)+'" y="'+(Y(x.kg)-10)+'" text-anchor="middle" font-size="12" fill="var(--fg)">'+x.kg+'</text>'}).join('');
    box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'"><line x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'" stroke="var(--line)"/>'+
      '<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+dots+'</svg>';
  }

  function rows(){
    $('rows').innerHTML=data.map(function(x,i){return {x:x,i:i}}).reverse().map(function(o){
      var x=o.x;
      return '<tr><td>'+esc(fmtDate(x.date))+'</td><td>'+esc(x.ex)+'</td><td>'+x.kg+' kg</td>'+
        '<td'+(x.ok?'':' class="fail"')+'>'+x.reps+(x.ok?'':' (échec)')+'</td>'+
        '<td><button class="ghost" data-i="'+o.i+'" aria-label="Supprimer">Suppr.</button></td></tr>'}).join('');
  }

  function render(){fillFilter();stats();chart();rows()}

  $('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var kg=parseFloat($('kg').value),r=parseInt($('r').value,10);
    if(isNaN(kg)||isNaN(r))return;
    data.push({date:$('d').value||new Date().toISOString().slice(0,10),ex:$('ex').value.trim()||'Exercice',kg:kg,reps:r,ok:$('ok').value==='1'});
    save();$('ex-filter').value=data[data.length-1].ex;render();
    $('kg').value='';$('r').value='';
  });
  $('rows').addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-i]');if(!b)return;
    data.splice(parseInt(b.dataset.i,10),1);save();render();
  });
  $('ex-filter').addEventListener('change',function(){stats();chart()});
  $('d').value=new Date().toISOString().slice(0,10);
  render();
})();
</script>
</body>
</html>
