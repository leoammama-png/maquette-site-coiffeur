<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0D1116">
<title>Mes perfs salle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0D1116;--surface:#151B22;--surface2:#1B232C;--fg:#E9EDF0;--muted:#8D99A5;--line:#242D37;
  --accent:#4C8DFF;--accent-soft:#16294A;--accent-fg:#06101F;--gold:#F2C230;--bad:#FF8570;--good:#5ED69B;--warm:#8795A2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --pad:max(16px,calc((100vw - 760px)/2 + 16px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--text);padding-bottom:max(56px,env(safe-area-inset-bottom));overflow-x:hidden}
.skip{position:absolute;left:12px;top:-60px;z-index:20;background:var(--accent);color:var(--accent-fg);padding:12px 14px;border-radius:10px;font-weight:700;text-decoration:none}
.skip:focus{top:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- hero 3D ---------- */
.hero{position:relative;isolation:isolate;display:grid;grid-template-rows:auto 1fr;min-height:clamp(620px,88svh,780px);overflow:hidden;
  background:radial-gradient(110% 75% at 68% 38%,#1d2833 0%,#111820 52%,#0A0E13 100%)}
#rig{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;opacity:0;transition:opacity .5s ease}
.hero.gl-ready #rig{opacity:1}
#rig:active{cursor:grabbing}
#rig:focus-visible{outline-offset:-4px}
.no-gl #rig,.no-gl .hint{display:none}
.no-gl .hero{min-height:0}
.hero-top,.hero-copy{position:relative;z-index:1;pointer-events:none;padding-inline:var(--pad)}
.hero-top{padding-top:max(20px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font:700 32px/1 var(--display);letter-spacing:.005em;margin:0}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:26ch}
.hint{display:flex;align-items:center;gap:8px;margin:4px 0 0;color:var(--muted);font-size:13px;white-space:nowrap;transition:opacity .4s ease}
.hint svg{width:18px;height:18px}
.dragged .hint{opacity:0}
.hero-copy{padding-bottom:26px;align-self:end}
.lift-name{margin:0;font-weight:600;font-size:18px;line-height:1.2;max-width:28ch}
.lift-num{margin:2px 0 0;font:700 clamp(96px,27vw,176px)/.84 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.lift-num small{font-size:.26em;font-weight:600;color:var(--muted);margin-left:.14em;letter-spacing:0}
.lift-meta{margin:8px 0 0;color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
.rig-note{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:44ch}

.hero:not(.go) [data-i]{opacity:0}
.hero.go [data-i]{animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--d,0)*1ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- chiffres ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);background:var(--bg)}
.stat{padding:18px 8px 16px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:700 clamp(34px,9vw,52px)/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}

.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h2{font:700 26px/1.1 var(--display);letter-spacing:.01em;margin:38px 0 12px}

/* ---------- records récents ---------- */
.prs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.prs::-webkit-scrollbar{display:none}
.pr{flex:0 0 auto;width:min(236px,68vw);scroll-snap-align:start;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:6px 6px 14px 14px;padding:12px 14px 14px;
  transition:transform .25s var(--ease),border-color .25s ease,background-color .25s ease}
.pr:hover{transform:translateY(-3px);background:var(--surface2)}
.pr:active{transform:translateY(0)}
.pr .n{display:block;font-weight:600;line-height:1.2;min-height:2.4em}
.pr .v{display:block;margin-top:6px;font:700 38px/1 var(--display);font-variant-numeric:tabular-nums}
.pr .v i{font-style:normal;font-size:.5em;color:var(--muted);font-weight:600;margin-left:.2em}
.pr .g{display:block;margin-top:6px;font-size:13px;color:var(--good);font-variant-numeric:tabular-nums}
.pr .d{color:var(--muted);margin-left:6px}

/* ---------- navigation ---------- */
nav{position:sticky;top:0;z-index:5;margin:22px -16px 0;padding:10px 16px 10px;background:rgba(13,17,22,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:600 14px/1 var(--text);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:14px 15px;cursor:pointer;white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s var(--ease)}
.chip:hover{border-color:#34414f}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.search{margin-top:8px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;min-height:44px}
input::placeholder{color:#6f7b87}

/* ---------- exercices ---------- */
#list{view-transition-name:list}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;transition:border-color .3s ease,box-shadow .3s ease}
.ex:hover{border-color:#32404e}
.ex.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ex-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ex-name{font-weight:650;font-size:17px;line-height:1.2}
.ex-meta{font-size:13px;color:var(--muted);margin-top:3px}
.rec{text-align:right;white-space:nowrap}
.rec b{font:700 34px/.95 var(--display);font-variant-numeric:tabular-nums}
.rec b small{font:600 14px var(--text);color:var(--muted);margin-left:2px}
.rec span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font:700 12px/1 var(--text);background:var(--gold);color:#201a05;border-radius:5px;padding:3px 6px;margin-left:8px;vertical-align:2px;animation:pop .6s var(--ease) both .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.spark{margin:12px 0 8px;position:relative;touch-action:pan-y;cursor:crosshair}
.spark-dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--gc);border:2px solid var(--bg);box-shadow:0 0 10px var(--gc);pointer-events:none;opacity:0;transition:opacity .15s ease}
.spark-read{position:absolute;top:-22px;left:0;font:600 13px/1 var(--text);color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s ease;font-variant-numeric:tabular-nums}
.spark.scrub .spark-dot,.spark.scrub .spark-read{opacity:1}
.gain{color:var(--good);font-weight:600}
.spark svg{display:block;width:100%;height:52px;overflow:visible}
.spark .area{fill:var(--accent);opacity:.1}
.spark .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.anim .spark .line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s var(--ease) .1s forwards}
.anim .spark .area{animation:fadein .8s ease .5s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:.1}}
.last{font-size:14px;font-variant-numeric:tabular-nums}
.last .dt{color:var(--muted);margin-right:8px}
.w{color:var(--warm)}
.f{color:var(--bad);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
button.load{font:600 14px/1 var(--text);color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:11px 14px;min-height:44px;cursor:pointer;
  transition:background-color .2s ease,border-color .2s ease,transform .2s var(--ease)}
button.load:hover{border-color:var(--accent);background:var(--accent-soft)}
button.load:active{transform:scale(.97)}
details.hist{margin-top:4px}
details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;padding:12px 0;list-style:none;min-height:44px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin-right:10px;transition:transform .25s var(--ease)}
details[open]>summary::before{transform:rotate(45deg) translate(-2px,-2px)}
details{interpolate-size:allow-keywords}
details::details-content{block-size:0;overflow:clip;transition:block-size .3s var(--ease),content-visibility .3s allow-discrete}
details[open]::details-content{block-size:auto}
.sess{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.sess .dt{color:var(--muted)}
.sess .sets{display:flex;flex-wrap:wrap;gap:4px 10px}
.empty{color:var(--muted);text-align:center;padding:28px 0}

/* ---------- formulaire ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
form{display:grid;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{display:grid;gap:5px;font-size:14px;font-weight:600}
button.primary{font:700 16px/1 var(--text);border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);padding:15px 22px;min-height:48px;cursor:pointer;transition:transform .2s var(--ease),filter .2s ease}
button.primary:hover{filter:brightness(1.1)}
button.primary:active{transform:scale(.97)}
button.ghost{font:600 13px/1 var(--text);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:12px 14px;min-height:44px;cursor:pointer}
button.ghost:hover{color:var(--fg);border-color:#3a4857}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.mine{margin-top:12px}
.mine .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}

/* ---------- transition de liste (changement de groupe) ---------- */
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(list){animation:.14s ease-in both vt-out}
::view-transition-new(list){animation:.32s var(--ease) both vt-in}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(12px)}}

@media (max-width:560px){.hint{display:none}.sub{max-width:20ch}}
@media (min-width:900px){
  .hero{min-height:clamp(560px,78svh,720px)}
  .sub{max-width:none}
  .lift-num{font-size:176px}
  .hero-copy{padding-bottom:40px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .hero:not(.go) [data-i]{opacity:1}
  .anim .spark .line{stroke-dashoffset:0}
}

/* ===== v3 : couleur par groupe, relief, énergie ===== */
@property --gc{syntax:'<color>';inherits:true;initial-value:#FF5A3C}
:root{--bg:#090C11;--surface:#121821;--surface2:#1A2230;--line:#232D3A;--muted:#93A0AD;--gc:#FF5A3C;--hot:#FF5A3C;--sun:#FFB020}
html{transition:--gc .7s ease}
body{background:
  radial-gradient(900px 520px at 105% 520px,color-mix(in srgb,var(--gc) 12%,transparent),transparent 70%),
  radial-gradient(760px 460px at -15% 1100px,color-mix(in srgb,var(--gc) 8%,transparent),transparent 70%),
  var(--bg)}
h1{font-size:38px;text-transform:uppercase;letter-spacing:.05em}
h1::after{content:"";display:block;width:56px;height:5px;margin-top:8px;border-radius:3px;background:linear-gradient(90deg,var(--gc),var(--sun))}
.sub{color:#B3BDC7}
.hero{background:
  radial-gradient(70% 62% at 72% 40%,color-mix(in srgb,var(--gc) 40%,transparent) 0%,transparent 68%),
  radial-gradient(60% 50% at 6% 100%,color-mix(in srgb,var(--gc) 20%,transparent),transparent 70%),
  linear-gradient(180deg,#111821,#090C11)}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(80% 85% at 70% 40%,#000,transparent 78%);mask-image:radial-gradient(80% 85% at 70% 40%,#000,transparent 78%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;z-index:2;background:linear-gradient(90deg,transparent,var(--gc),var(--sun),transparent)}
.tag{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;padding:7px 13px 7px 11px;border-radius:999px;font:700 12px/1 var(--text);letter-spacing:.14em;text-transform:uppercase;
  color:color-mix(in srgb,var(--gc) 55%,#fff);background:color-mix(in srgb,var(--gc) 16%,transparent);border:1px solid color-mix(in srgb,var(--gc) 50%,transparent)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gc);box-shadow:0 0 12px var(--gc)}
.tag:empty{display:none}
.lift-name{font-size:20px;font-weight:700}
.lift-num{background:linear-gradient(180deg,#fff 18%,color-mix(in srgb,var(--gc) 65%,#fff) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 8px 44px color-mix(in srgb,var(--gc) 50%,transparent))}
.lift-num small{-webkit-text-fill-color:var(--gc);color:var(--gc)}
.lift-meta{color:#DDE3E8}

.stats{background:linear-gradient(180deg,var(--surface),var(--bg))}
.stat{border-top:4px solid var(--gc);position:relative}
.stat:nth-child(1){--gc:#FF5A3C}.stat:nth-child(2){--gc:#3DA5FF}.stat:nth-child(3){--gc:#2FD38A}
.stat::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 16%,transparent),transparent 70%);pointer-events:none}
.stat b{position:relative;background:linear-gradient(180deg,#fff 10%,var(--gc));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stat span{position:relative}

h2{display:flex;align-items:center;gap:12px;text-transform:uppercase;letter-spacing:.07em;font-size:25px}
h2::before{content:"";flex:0 0 auto;width:6px;height:1.05em;border-radius:3px;background:linear-gradient(var(--gc),color-mix(in srgb,var(--gc) 25%,transparent));box-shadow:0 0 14px color-mix(in srgb,var(--gc) 55%,transparent)}

.pr{position:relative;overflow:hidden;border-top-color:var(--line);
  background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 26%,var(--surface)),var(--surface) 64%);
  border-color:color-mix(in srgb,var(--gc) 38%,var(--line))}
.pr::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--gc);box-shadow:0 0 18px var(--gc)}
.pr .v{color:#fff;text-shadow:0 0 26px color-mix(in srgb,var(--gc) 65%,transparent)}
.pr .g{color:color-mix(in srgb,var(--gc) 55%,#fff);font-weight:700}
.pr:hover{background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 34%,var(--surface)),var(--surface) 70%);box-shadow:0 14px 32px -14px color-mix(in srgb,var(--gc) 70%,transparent)}

nav{background:rgba(9,12,17,.86)}
.chip{display:inline-flex;align-items:center;gap:8px;border-color:color-mix(in srgb,var(--gc) 30%,var(--line))}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gc);flex:0 0 auto}
.chip:hover{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 14%,var(--surface))}
.chip[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#0A0D12;box-shadow:0 8px 24px -8px var(--gc)}
.chip[aria-pressed="true"]::before{background:#0A0D12}

.ex{position:relative;overflow:hidden;padding-left:22px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--gc) 15%,var(--surface)),var(--surface) 58%);
  border-color:color-mix(in srgb,var(--gc) 24%,var(--line))}
.ex::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--gc),color-mix(in srgb,var(--gc) 25%,transparent))}
.ex:hover{border-color:color-mix(in srgb,var(--gc) 60%,var(--line));box-shadow:0 16px 36px -18px color-mix(in srgb,var(--gc) 70%,transparent)}
.ex.on{border-color:var(--gc);box-shadow:0 0 0 1px var(--gc) inset,0 0 44px -12px var(--gc)}
.rec b{color:#fff;font-size:42px;text-shadow:0 0 26px color-mix(in srgb,var(--gc) 55%,transparent)}
.rec b small{color:var(--gc);font-size:14px;text-shadow:none}
.ex-name{font-size:18px}
.badge{background:linear-gradient(135deg,#FFD84A,#FF9F1C);color:#2a1a00;box-shadow:0 0 16px rgba(255,176,32,.55);letter-spacing:.06em}
.spark .line{stroke:var(--gc);stroke-width:3;filter:drop-shadow(0 0 6px var(--gc))}
.spark .area{fill:var(--gc);opacity:.2}
.anim .spark .area{animation:fadein2 .8s ease .5s both}
@keyframes fadein2{from{opacity:0}to{opacity:.2}}
.last .dt{color:color-mix(in srgb,var(--gc) 50%,#fff)}
details summary{color:color-mix(in srgb,var(--gc) 55%,#fff)}
button.load{border-color:color-mix(in srgb,var(--gc) 55%,var(--line));background:color-mix(in srgb,var(--gc) 12%,var(--surface2))}
button.load:hover{background:var(--gc);border-color:var(--gc);color:#0A0D12}

.card{background:linear-gradient(150deg,color-mix(in srgb,var(--gc) 12%,var(--surface)),var(--surface) 60%);border-color:color-mix(in srgb,var(--gc) 28%,var(--line))}
button.primary{background:linear-gradient(135deg,var(--hot),var(--sun));color:#1B0C03;box-shadow:0 10px 28px -10px var(--hot)}
input:focus,select:focus{border-color:var(--gc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 35%,transparent)}
@media (max-width:560px){#rig{transform:scale(1.4);transform-origin:50% 46%}.hero{min-height:clamp(640px,92svh,780px)}}
@media (prefers-reduced-motion:reduce){html{transition:none}.anim .spark .area{animation:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Aller aux exercices</a>

<header class="hero" id="hero">
  <canvas id="rig" role="img" aria-label="Montage 3D de la charge du record affiché. Glisse pour tourner." tabindex="0"></canvas>
  <div class="hero-top">
    <div data-i style="--d:0">
      <h1>Mes perfs salle</h1>
      <p class="sub" id="sub">Force par groupe musculaire.</p>
    </div>
    <p class="hint" data-i style="--d:900"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>Glisse pour tourner</p>
  </div>
  <div class="hero-copy" aria-live="polite">
    <p class="tag" id="lift-tag" data-i style="--d:100"></p>
    <p class="lift-name" id="lift-name" data-i style="--d:150">Chargement…</p>
    <p class="lift-num" data-i style="--d:260"><span id="lift-kg">0</span><small>kg</small></p>
    <p class="lift-meta" id="lift-meta" data-i style="--d:380"></p>
    <p class="rig-note" id="rig-note" data-i style="--d:480"></p>
  </div>
</header>

<section class="stats" id="tiles" aria-label="Chiffres clés"></section>

<main class="wrap" id="main">
  <h2>Records récents</h2>
  <div class="prs" id="prs"></div>

  <nav aria-label="Groupes musculaires">
    <div class="chips" id="chips"></div>
    <div class="search"><input id="q" type="search" placeholder="Chercher un exercice" aria-label="Chercher un exercice" autocomplete="off"></div>

  function num(n){return String(Math.round(n*100)/100).replace('.',',')}
  var GC={'Pectoraux':'#FF5A3C','Dos':'#3DA5FF','Épaules':'#FFB020','Biceps':'#2FD38A','Triceps':'#FF4D8D','Avant-bras':'#22D3C5','Quadriceps':'#B6E64A','Ischios & fessiers':'#FF8A4C','Mollets':'#5CC8FF','Abdos':'#FFD84A'};
  var GCX=['#FF6B6B','#4DD0E1','#FFCA28','#66BB6A','#FF7043','#29B6F6'];
  function gc(g){
    if(GC[g])return GC[g];
    var h=0;for(var i=0;i<String(g).length;i++)h=(h*31+String(g).charCodeAt(i))>>>0;
    return GCX[h%GCX.length];
  }

  /* --- modèle --- */
  function build(){
    var gs=JSON.parse(JSON.stringify(BASE.groups));
    function findEx(name){
      for(var i=0;i<gs.length;i++)for(var j=0;j<gs[i].ex.length;j++)if(gs[i].ex[j].n.toLowerCase()===name.toLowerCase())return gs[i].ex[j];
      return null;
    }
    extras.forEach(function(x){
      var e=findEx(x.n);
      if(!e){
        var g=null;gs.forEach(function(k){if(k.g===x.g)g=k});
        if(!g){g={g:x.g,ex:[]};gs.push(g)}
        e={n:x.n,ss:[]};g.ex.push(e);
      }
      var ses=null;e.ss.forEach(function(s){if(s.d===x.d)ses=s});
      if(!ses){ses={d:x.d,s:[]};e.ss.push(ses);e.ss.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0})}
      ses.s.push([x.kg,x.r,x.ok?'n':'f']);
    });
    return gs;
  }
  function topOf(ses){
    var best=null;
    ses.s.forEach(function(a){
      if(a[2]==='w'||a[2]==='f'||a[1]<1)return;
      if(!best||a[0]>best[0]||(a[0]===best[0]&&a[1]>best[1]))best=a;
    });
    return best;
  }
  function analyse(e){
    var tops=[];
    e.ss.forEach(function(s){var t=topOf(s);if(t)tops.push({d:s.d,kg:t[0],r:t[1]})});
    var rec=null;
    tops.forEach(function(t){if(!rec||t.kg>rec.kg||(t.kg===rec.kg&&t.r>rec.r))rec=t});
    var isPR=false,prevBest=null;
    if(tops.length>=3){
      var last=tops[tops.length-1];
      var prior=tops.slice(0,-1);
      prevBest=Math.max.apply(null,prior.map(function(t){return t.kg}));
      isPR=last.kg>prevBest;
    }
    return {tops:tops,rec:rec,isPR:isPR,prevBest:prevBest};
  }

  /* --- type de montage 3D d'après le nom de l'exercice --- */
  function kindOf(n){
    var s=n.toLowerCase();
    if(/lest/.test(s))return 'plate';
    if(/haltère|goblet/.test(s)||/^(écarté|curl marteau|curl marteau assis|curl biceps|los curlos)$/.test(s))return 'dumbbell';
    if(/barre|smith/.test(s)||/^(squat complet|soulevé de terre)/.test(s))return 'barbell';
    return 'stack';
  }
  var LOAD_LABEL={barbell:'Charger la barre',dumbbell:'Voir l’haltère',plate:'Voir le lest',stack:'Placer la clavette'};

  /* --- rendu --- */
  function setHtml(a){
    var t=a[2],txt=num(a[0])+'×'+a[1];
    if(t==='w')return '<span class="w" title="Échauffement">('+txt+')</span>';
    if(t==='f')return '<span class="f">'+txt+' échec</span>';
    if(a[1]===0)return '<span class="f">'+num(a[0])+'×0</span>';
    if(t==='d')return '<span>'+txt+' <small class="w">drop</small></span>';
    return '<span>'+txt+'</span>';
  }
  function spark(tops,name){
    var pts=tops.slice(-24);
    if(pts.length<2)return '';
    var W=300,H=52,P=4,ks=pts.map(function(t){return t.kg});
    var lo=Math.min.apply(null,ks),hi=Math.max.apply(null,ks);
    if(hi===lo){hi+=1;lo-=1}
    function X(i){return P+i*(W-2*P)/(pts.length-1)}
    function Y(k){return H-P-(k-lo)*(H-2*P)/(hi-lo)}
    var line=pts.map(function(t,i){return X(i).toFixed(1)+','+Y(t.kg).toFixed(1)}).join(' ');
    var area=X(0).toFixed(1)+','+H+' '+line+' '+X(pts.length-1).toFixed(1)+','+H;
    var li=pts.length-1;
    var data=pts.map(function(t){return t.d+'|'+t.kg}).join(';');
    return '<div class="spark" data-pts="'+esc(data)+'" data-lo="'+lo+'" data-hi="'+hi+'"><span class="spark-dot"></span><span class="spark-read" aria-hidden="true"></span><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Évolution de la charge max, '+esc(name)+' : de '+num(ks[0])+' à '+num(ks[li])+' kg">'+
      '<polygon class="area" points="'+area+'"/>'+
      '<polyline class="line" pathLength="1" points="'+line+'" vector-effect="non-scaling-stroke"/>'+
      '</svg></div>';
  }
  function gainTxt(an){
    if(an.tops.length<2)return '';
    var f=an.tops[0],l=an.tops[an.tops.length-1],d=Math.round((l.kg-f.kg)*100)/100;
    if(d<=0)return '';
    return ' · <span class="gain">+'+num(d)+' kg depuis le '+fmtD(f.d)+'</span>';
  }
  function scrub(ev){
    var sp=ev.target.closest&&ev.target.closest('.spark');
    if(!sp)return;
    var pts=sp.getAttribute('data-pts').split(';').map(function(p){var a=p.split('|');return{d:a[0],kg:parseFloat(a[1])}});
    var lo=parseFloat(sp.getAttribute('data-lo')),hi=parseFloat(sp.getAttribute('data-hi'));
    var r=sp.getBoundingClientRect(),W=300,H=52,P=4;
    var fx=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
    var i=Math.round(fx*(pts.length-1)),t=pts[i];
    var x=(P+i*(W-2*P)/(pts.length-1))/W*100;
    var y=(H-P-(t.kg-lo)*(H-2*P)/(hi-lo))/H*100;
    var dot=sp.querySelector('.spark-dot'),rd=sp.querySelector('.spark-read');
    dot.style.left=x+'%';dot.style.top=y+'%';
    rd.textContent=fmtD(t.d)+' · '+num(t.kg)+' kg';
    var w=rd.offsetWidth;rd.style.left=Math.min(Math.max(0,x/100*r.width-w/2),r.width-w)+'px';
    sp.classList.add('scrub');
  }
  document.addEventListener('pointermove',scrub);
  document.addEventListener('pointerdown',scrub);
  function endScrub(ev){
    Array.prototype.forEach.call(document.querySelectorAll('.spark.scrub'),function(s){
      if(!ev||!ev.target.closest||ev.target.closest('.spark')!==s)s.classList.remove('scrub');
    });
  }
  document.addEventListener('pointermove',endScrub);
  document.addEventListener('pointerup',function(){setTimeout(function(){endScrub(null)},1200)});
  function exHtml(e,grp){
    var an=analyse(e);
    var sessions=e.ss.slice();
    var last=sessions[sessions.length-1];
    var recTxt=an.rec?'<div class="rec"><b>'+num(an.rec.kg)+'<small>kg × '+an.rec.r+'</small></b><span>record · '+fmtD(an.rec.d)+'</span></div>':'<div class="rec"><span>pas de série valide</span></div>';
    var kind=kindOf(e.n);
    var h='<article class="ex'+(state.rig===e.n?' on':'')+'" style="--gc:'+gc(grp)+'"><div class="ex-top"><div><div class="ex-name">'+esc(e.n)+(an.isPR?'<span class="badge">RECORD</span>':'')+'</div>'+
      '<div class="ex-meta">'+sessions.length+' séance'+(sessions.length>1?'s':'')+gainTxt(an)+'</div></div>'+recTxt+'</div>';
    h+=spark(an.tops,e.n);
    if(last)h+='<div class="last"><span class="dt">'+fmtD(last.d)+'</span>'+last.s.map(setHtml).join(' · ')+'</div>';
    h+='<div class="row">';
    if(sessions.length>1){
      h+='<details class="hist"><summary>Historique ('+Math.min(sessions.length,10)+' dernières)</summary>';
      sessions.slice(-10).reverse().forEach(function(s){
        h+='<div class="sess"><span class="dt">'+fmtD(s.d)+'</span><span class="sets">'+s.s.map(setHtml).join('')+'</span></div>';
      });
      h+='</details>';
    }else h+='<span></span>';
    if(an.rec)h+='<button type="button" class="load" data-ex="'+esc(e.n)+'" aria-label="'+LOAD_LABEL[kind]+' : '+esc(e.n)+'">'+LOAD_LABEL[kind]+'</button>';
    return h+'</div></article>';
  }

  /* --- héros 3D --- */
  var shownKg=0,countRaf=0;
  function countTo(el,to,ms){
    cancelAnimationFrame(countRaf);
    var from=parseFloat(String(el.getAttribute('data-v')||'0'));
    el.setAttribute('data-v',to);
    if(reduced()||!ms||from===to){el.textContent=num(to);return}
    var t0=performance.now();
    (function step(now){
      var k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);
      var v=from+(to-from)*e;
      el.textContent=num(k<1?Math.round(v*2)/2:to);
      if(k<1)countRaf=requestAnimationFrame(step);
    })(t0);
  }
  var heroKg;
  function selectRig(e,an,animateNumber){
    if(!e||!an||!an.rec)return;
    state.rig=e.n;
    var L=lookup[e.n],grp=L?L.g:'';
    document.documentElement.style.setProperty('--gc',gc(grp));
    $('lift-tag').textContent=grp;
    var kind=kindOf(e.n);
    var spec={kind:kind,kg:an.rec.kg,label:e.n};
    window.__rig=spec;
    window.dispatchEvent(new CustomEvent('rig:set',{detail:spec}));
    $('lift-name').textContent=e.n;
    $('lift-meta').textContent='Record du '+fmtDY(an.rec.d)+' · '+an.rec.r+' rep'+(an.rec.r>1?'s':'');
    countTo(heroKg,an.rec.kg,animateNumber?900:0);
    $('rig').setAttribute('aria-label','Montage 3D : '+e.n+', '+num(an.rec.kg)+' kg. Glisse pour tourner.');
  }

  var lookup={};
  function render(){
    var gs=build();
    lookup={};
    gs.forEach(function(g){g.ex.forEach(function(e){lookup[e.n]={e:e,an:analyse(e),g:g.g}})});
    var days={},nsets=0,first=null,lastD=null;
    gs.forEach(function(g){g.ex.forEach(function(e){e.ss.forEach(function(s){
      var w=s.s.filter(function(a){return a[2]!=='w'});
      if(w.length){days[s.d]=1;nsets+=w.length}
      if(!first||s.d<first)first=s.d;if(!lastD||s.d>lastD)lastD=s.d;
    })})});
    $('tiles').innerHTML=
      '<div class="stat"><b data-count="'+Object.keys(days).length+'">'+Object.keys(days).length+'</b><span>jours d’entraînement</span></div>'+
      '<div class="stat"><b data-count="'+nsets+'">'+nsets+'</b><span>séries de travail</span></div>'+
      '<div class="stat"><b>'+fmtD(lastD)+'</b><span>dernière séance</span></div>';
    $('sub').textContent='Force par groupe musculaire, depuis le '+fmtDY(first)+'.';
    if(state.first&&!reduced()){
      Array.prototype.forEach.call($('tiles').querySelectorAll('[data-count]'),function(b,i){
        var to=parseInt(b.getAttribute('data-count'),10),t0=performance.now()+300+i*120;
        b.textContent='0';
        (function step(now){
          var k=Math.max(0,Math.min(1,(now-t0)/1100));
          b.textContent=String(Math.round(to*(1-Math.pow(1-k,3))));
          if(k<1)requestAnimationFrame(step);
        })(performance.now());
      });
    }

    /* records récents : 21 jours avant la dernière séance */
    var ref=new Date(lastD+'T12:00:00');ref.setDate(ref.getDate()-21);
    var cut=ref.toISOString().slice(0,10),prs=[];
    gs.forEach(function(g){g.ex.forEach(function(e){
      var an=analyse(e);
      if(an.tops.length<3)return;
      var run=an.tops[0].kg;
      for(var i=1;i<an.tops.length;i++){
        var t=an.tops[i];
        if(t.kg>run&&t.d>=cut)prs.push({n:e.n,d:t.d,kg:t.kg,r:t.r,from:run});
        if(t.kg>run)run=t.kg;
      }
    })});
    var seen={};prs=prs.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.kg-a.kg}).filter(function(p){if(seen[p.n])return false;seen[p.n]=1;return true}).slice(0,6);
    $('prs').innerHTML=prs.length?prs.map(function(p){
      var pg=lookup[p.n]?lookup[p.n].g:'';
      return '<button type="button" class="pr" style="--gc:'+gc(pg)+'" data-ex="'+esc(p.n)+'" aria-label="'+esc(p.n)+', '+num(p.kg)+' kilos, record du '+fmtD(p.d)+'. Voir en 3D"><span class="n">'+esc(p.n)+'</span>'+
        '<span class="v">'+num(p.kg)+'<i>kg × '+p.r+'</i></span><span class="g">+'+num(p.kg-p.from)+' kg<span class="d">'+fmtD(p.d)+'</span></span></button>';
    }).join(''):'<p class="note">Aucun record dans les 3 dernières semaines.</p>';

    /* chips */
    var names=['Tous'].concat(gs.map(function(g){return g.g}));
    if(names.indexOf(state.group)<0)state.group='Tous';
    $('chips').innerHTML=names.map(function(n){
      return '<button type="button" class="chip" style="--gc:'+(n==='Tous'?'#E9EDF0':gc(n))+'" data-g="'+esc(n)+'" aria-pressed="'+(n===state.group)+'">'+esc(n)+'</button>';
    }).join('');

    /* liste */
    var q=state.q.trim().toLowerCase(),out='',count=0;
    gs.forEach(function(g){
      if(state.group!=='Tous'&&g.g!==state.group)return;
      var list=g.ex.filter(function(e){return !q||e.n.toLowerCase().indexOf(q)>-1});
      if(!list.length)return;
      if(state.group==='Tous')out+='<h2 style="--gc:'+gc(g.g)+'">'+esc(g.g)+'</h2>';
      list.forEach(function(e){out+=exHtml(e,g.g);count++});
    });
    $('list').className=state.anim?'anim':'';
    state.anim=false;
    $('list').innerHTML=count?out:'<p class="empty">Aucun exercice trouvé.</p>';

    /* formulaire */
    var all=[];gs.forEach(function(g){g.ex.forEach(function(e){all.push(e.n)})});
    $('ex-list').innerHTML=all.sort().map(function(n){return '<option value="'+esc(n)+'">'}).join('');
    var cur=$('g').value;
    $('g').innerHTML=gs.map(function(g){return '<option>'+esc(g.g)+'</option>'}).join('');
    if(cur)$('g').value=cur;

    /* mes ajouts */
    $('mine').innerHTML=extras.length?'<h2 style="margin-top:0;font-size:22px">Mes ajouts</h2>'+extras.map(function(x,i){
      return '<div class="r"><span>'+fmtD(x.d)+' · '+esc(x.n)+' · '+num(x.kg)+'×'+x.r+(x.ok?'':' (échec)')+'</span><button class="ghost" data-del="'+i+'" aria-label="Supprimer cet ajout">Suppr.</button></div>';
    }).join(''):'';

    /* héros : exercice par défaut = dernier record, sinon le plus suivi */
    if(!state.rig||!lookup[state.rig]){
      var pick=null;
      if(prs.length&&lookup[prs[0].n])pick=lookup[prs[0].n];
      else{var best=-1;Object.keys(lookup).forEach(function(k){var l=lookup[k];if(l.an.rec&&l.e.ss.length>best){best=l.e.ss.length;pick=l}})}
      if(pick)selectRig(pick.e,pick.an,true);
    }else{
      var cu=lookup[state.rig];
      if(cu.an.rec&&Math.abs(parseFloat(heroKg.getAttribute('data-v')||'0')-cu.an.rec.kg)>0.001)selectRig(cu.e,cu.an,true);
    }
    state.first=false;
  }

  function loadRig(name){
    var l=lookup[name];if(!l)return;
    selectRig(l.e,l.an,true);
    Array.prototype.forEach.call(document.querySelectorAll('.ex'),function(el){
      var n=el.querySelector('.ex-name');el.classList.toggle('on',!!n&&n.firstChild&&n.firstChild.textContent===name);
    });
    hero.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'});
  }

  /* --- événements --- */
  $('chips').addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-g]');if(!b)return;
    var g=b.getAttribute('data-g');
    function go(){state.group=g;state.anim=true;render()}
    if(document.startViewTransition&&!reduced())document.startViewTransition(go);else go();
    var again=$('chips').querySelector('[aria-pressed="true"]');
    if(again)again.scrollIntoView({inline:'center',block:'nearest',behavior:reduced()?'auto':'smooth'});
  });
  $('q').addEventListener('input',function(){state.q=this.value;render()});
  document.addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-ex]');if(b)loadRig(b.getAttribute('data-ex'));
  });
  $('mine').addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-del]');if(!b)return;
    extras.splice(parseInt(b.getAttribute('data-del'),10),1);saveExtras();render();
  });
  $('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var kg=parseFloat($('kg').value),r=parseInt($('r').value,10),n=$('ex').value.trim();
    if(isNaN(kg)||isNaN(r)||!n)return;
    extras.push({n:n,g:$('g').value,d:$('d').value||new Date().toISOString().slice(0,10),kg:kg,r:r,ok:$('ok').value==='1'});
    saveExtras();
    $('kg').value='';$('r').value='';
    render();
  });
  $('rig').addEventListener('pointerdown',function(){hero.classList.add('dragged')});
  $('rig').addEventListener('keydown',function(){hero.classList.add('dragged')});
  $('d').value=new Date().toISOString().slice(0,10);

  heroKg=$('lift-kg');
  render();
  /* un seul moment orchestré : l'entrée du héros */
  requestAnimationFrame(function(){requestAnimationFrame(function(){hero.classList.add('go')})});
})();
</script>
