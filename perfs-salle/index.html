<title>Mes perfs salle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

<body>
<a class="skip" href="#main">Aller aux exercices</a>

<header class="hero" id="hero">
  <canvas id="rig" role="img" aria-label="Montage 3D de la charge du record affiché. Glisse pour tourner." tabindex="0"></canvas>
  <div class="hero-top">
    <div data-i style="--d:0">
      <h1>Mes perfs salle</h1>
      <p class="sub" id="sub">Force par groupe musculaire.</p>
    </div>
    <p class="hint" data-i style="--d:900"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>Glisse pour tourner</p>
  </div>
  <div class="hero-copy" aria-live="polite">
    <p class="tag" id="lift-tag" data-i style="--d:100"></p>
    <p class="lift-name" id="lift-name" data-i style="--d:150">Chargement…</p>
    <p class="lift-num" data-i style="--d:260"><span id="lift-kg">0</span><small>kg</small></p>
    <p class="lift-meta" id="lift-meta" data-i style="--d:380"></p>
    <p class="rig-note" id="rig-note" data-i style="--d:480"></p>
  </div>
</header>

<section class="stats" id="tiles" aria-label="Chiffres clés"></section>

<main class="wrap" id="main">
  <h2>Records récents</h2>
  <div class="prs" id="prs"></div>
  <a class="cta" href="exercices.html"><span>Tous les exercices</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</main>
